locale_seed: es-GT
timezone_seed: America/Guatemala
currency_seed: GTQ

quote_version_statuses:
  - draft
  - frozen
  - superseded
  - voided

authorization_request_statuses:
  - prepared
  - sent
  - viewed
  - decided
  - expired
  - revoked

authorization_statuses:
  - accepted
  - partially_accepted
  - rejected
  - invalidated

case_statuses:
  - new
  - triage
  - waiting_customer
  - scheduled
  - received
  - inspection
  - waiting_authorization
  - ready
  - in_progress
  - blocked
  - quality
  - ready_for_delivery
  - delivered
  - closed
  - cancelled

provenance:
  - observed
  - measured
  - reported
  - estimated
  - derived

visibility:
