  - customer
  - shared_case

vehicle_now_statuses:
  - action_required
  - attention
  - no_current_alerts
  - unknown
  - stale

service_price_modes:
  - fixed
  - from
  - range
  - inspection_required
  - diagnosis_required

maintenance_trigger_kinds:
