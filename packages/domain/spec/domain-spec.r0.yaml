# Extraído literalmente de DATATEK_R0_A_CONTRACT_PACK.md, sección 13.
# Especificación declarativa. No editar constantes generadas a mano:
# usar `pnpm spec:generate` tras modificar este archivo.
spec_version: "r0.1"
locale_seed: es-GT
timezone_seed: America/Guatemala
currency_seed: GTQ

quote_version_statuses:
  - draft
  - frozen
  - superseded
  - voided

authorization_request_statuses:
  - prepared
  - sent
  - viewed
  - decided
  - expired
  - revoked

authorization_statuses:
  - accepted
  - partially_accepted
  - rejected
  - invalidated

case_statuses:
  - new
  - triage
  - waiting_customer
  - scheduled
  - received
  - inspection
  - waiting_authorization
  - ready
  - in_progress
  - blocked
  - quality
  - ready_for_delivery
  - delivered
  - closed
  - cancelled

provenance:
  - observed
  - measured
  - reported
  - estimated
  - derived

visibility:
  - internal
  - customer
  - shared_case

vehicle_now_statuses:
  - action_required
  - attention
  - no_current_alerts
  - unknown
  - stale

service_price_modes:
  - fixed
  - from
  - range
  - inspection_required
  - diagnosis_required

maintenance_trigger_kinds:
  - date
  - odometer
  - whichever_first
  - condition

maintenance_statuses:
  - upcoming
  - due_soon
  - due
  - overdue
  - unknown

brake_conditions:
  - pass
  - attention
  - fail
  - not_inspected
  - not_applicable

# Extraído de DATATEK_R0_C_IDENTITY_TENANCY_ISOLATION.md, secciones 4 y 8.
# Catálogo canónico de permisos. Los permisos R0-D+ se seed-ean ya (sin
# entidad todavía) para no cambiar IDs/roles después (sección 4).
organization_permissions:
  - organization.read
  - organization.manage
  - branch.manage
  - membership.read
  - membership.manage
  - role.assign
  - catalog.read
  - catalog.manage
  - audit.read_organization
  # R0-D+ — catálogo ya reservado, sin entidad activa en R0-C.
  - crm.read
  - crm.manage
  - vehicle.read
  - vehicle.manage
  - intake.read
  - intake.manage
  - agenda.read
  - agenda.manage
  - inspection.read
  - inspection.publish
  - quote.read
  - quote.manage
  - authorization.request
  - authorization.decide
  - work.read
  - work.manage
  - quality.manage
  - finance.read
  - finance.manage

platform_permissions:
  - platform.control.enter
  - platform.organization.manage
  - platform.catalog.manage
  - platform.feature.manage
  - platform.support.manage
  - platform.security.read
  - platform.audit.read
  - platform.access.request
  - platform.access.approve
  - platform.access.use

# Templates de rol de organización y su mapeo aditivo a permisos (sección 8
# seed-ea estos actores; el template es la fuente, no un valor hardcodeado
# en la aplicación).
organization_role_templates:
  owner:
    - organization.read
    - organization.manage
    - branch.manage
    - membership.read
    - membership.manage
    - role.assign
    - catalog.read
    - catalog.manage
    - audit.read_organization
    - crm.read
    - crm.manage
    - vehicle.read
    - vehicle.manage
    - intake.read
    - intake.manage
    - agenda.read
    - agenda.manage
    - inspection.read
    - inspection.publish
    - quote.read
    - quote.manage
    - authorization.request
    - authorization.decide
    - work.read
    - work.manage
    - quality.manage
    - finance.read
    - finance.manage
  advisor:
    - organization.read
    - membership.read
    - catalog.read
    - crm.read
    - crm.manage
    - vehicle.read
    - vehicle.manage
    - intake.read
    - intake.manage
    - agenda.read
    - agenda.manage
    - inspection.read
    - quote.read
    - quote.manage
    - authorization.request
    - work.read
  inspector:
    - organization.read
    - catalog.read
    - vehicle.read
    - inspection.read
    - inspection.publish
    - work.read
  mechanic:
    - organization.read
    - catalog.read
    - vehicle.read
    - work.read
    - work.manage
  cashier:
    - organization.read
    - catalog.read
    - finance.read
    - finance.manage
  customer:
    - crm.read

platform_role_templates:
  platform_support:
    - platform.control.enter
    - platform.access.request
    - platform.access.use
  platform_security:
    - platform.control.enter
    - platform.security.read
    - platform.audit.read
  platform_admin:
    - platform.control.enter
    - platform.organization.manage
    - platform.catalog.manage
    - platform.feature.manage
    - platform.support.manage
    - platform.security.read
    - platform.audit.read
    - platform.access.approve
    - platform.access.use
  platform_auditor:
    - platform.control.enter
    - platform.audit.read
    - platform.security.read

security:
  permission_model: additive
  explicit_deny: false
  rls_with_each_table: true
  platform_roles_separate: true
  control_session_separate: true
  offline_sensitive_writes: false
  authorization_token_max_attempts: 5

experience:
  max_immediate_decisions: 3
  global_vehicle_health_score: false
  guest_authorization_requires_account: false
  plain_language_first: true
  technical_detail_on_demand: true
  guided_complex_flows: true
  reuse_known_data: true
